[platformio]
default_envs = bw21-cam-test
src_dir = src

[env]
platform = symlink://platform/amebapro2
board = bw21-cbv-kit
framework = arduino
monitor_speed = 115200

; PlatformIO drives the official Realtek Arduino CLI/core through the local
; AmebaPro2 platform. The versions are pinned for reproducible camera builds.
custom_arduino_cli_version = 1.5.1
custom_amebapro2_core = realtek:AmebaPro2@4.1.0
custom_amebapro2_index = https://github.com/Ameba-AIoT/ameba-arduino-pro2/raw/main/Arduino_package/package_realtek_amebapro2_index.json
custom_amebapro2_fqbn = realtek:AmebaPro2:Ameba_AMB82-MINI:04_CameraOption=gc2053,01_AutoUploadMode=Disable,02_UploadBaudrate=2M,03_EraseFlash=Disable,06_LoadNNModelSource=sd

[env:bw21-cam-test]
custom_fc_link = 0
custom_ondevice_vision = 0

[env:bw21-cam-wk2132]
custom_fc_link = 1
custom_ondevice_vision = 0

[env:bw21-cam-vision]
custom_fc_link = 0
custom_ondevice_vision = 1
custom_amebapro2_fqbn = realtek:AmebaPro2:Ameba_AMB82-MINI:04_CameraOption=gc2053,01_AutoUploadMode=Disable,02_UploadBaudrate=2M,03_EraseFlash=Disable,06_LoadNNModelSource=flash

[env:bw21-cam-vision-wk2132]
custom_fc_link = 1
custom_ondevice_vision = 1
custom_amebapro2_fqbn = realtek:AmebaPro2:Ameba_AMB82-MINI:04_CameraOption=gc2053,01_AutoUploadMode=Disable,02_UploadBaudrate=2M,03_EraseFlash=Disable,06_LoadNNModelSource=flash
